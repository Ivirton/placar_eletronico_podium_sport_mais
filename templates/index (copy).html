<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WebSocket Placar</title>
	<link rel="icon" href="/static/imagens/anuncios/logo_podium.png" type="image/x-icon">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="{{ url_for('static', filename='estilo/styles.css') }}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"
		integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	
</head>
<body>
	<header>
		<div class="dropdown">
			<a class="btn btn-secondary dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
				aria-expanded="false">
				Menu
			</a>

			<ul class="dropdown-menu">
				<li><a class="dropdown-item" href="/">Placar</a></li>
				<li><a class="dropdown-item" href="/upload">Anúcios</a></li>
			</ul>
		</div>
	</header>
	<main class="main">
		<section class="inputIn">
			<article class="coluna">
				<h4><a href="/placar_futebol" class="link-offset-3" target="_blank">Placar</a></h4>
				<i id="toggleIcon" ativo="{{dados.placar['status']}}"
					class="fa-solid fa-toggle-{{dados.placar['status']}} fa-2xl active-icon"></i>
			</article>
				<article class="coluna">
				<select class="form-select" aria-label="Default select example">
					<option selected>Escolha um esporte:</option>
					<option value="1">Futebol</option>
					<option value="2">futsal</option>
					<option value="3">futRua</option>
					<option value="4">Volei</option>
					<option value="5">Basquete</option>
				</select>
			</article>

			<article class="coluna">
				<input id="time1" placeholder="TIME 1" class="input-group-text" style="text-align:start;" type="text"
					value="{{dados.placar['time1']}}">
				<input placeholder="0" id="pontos1" style="width: 60px;margin-left:5px;" class="input-group-text"
					min="0" type="number" value="{{dados.placar['pontos1']}}">
			</article>
			<article class="coluna">
				<input id="time2" placeholder="TIME 2" class="input-group-text" style="text-align:start;" type="text"
					value="{{dados.placar['time2']}}">
				<input placeholder="0" id="pontos2" class="input-group-text" style="width: 60px;margin-left:5px;"
					min="0" type="number" value="{{dados.placar['pontos2']}}">
			</article>
			<article class="coluna">
				<input id="infor" placeholder="Informação" class="input-group-text" style="text-align:start;"
					type="text" value="{{dados.placar['infor']}}">
				 <input placeholder="0°" id="duracao" style="width: 60px;margin-left:5px;" class="input-group-text" min="0"
					type="number" value="{{dados.cronometro['duracao']}}"> 
			</article>
			<article class="coluna">
				<input class="btn btn-success" type="button" id="send" value="Enviar">
			</article>
		</section>
		<section class="inputIn">
			<article class="coluna">
				<h4>Cronômetro</h4>
				<article class="btn_cronometro">
					<i id="start" status="{{dados.cronometro['icone']}}" class="fa-solid fa-{{dados.cronometro['icone']}}"></i>
					<i id="stop" class="fa-solid fa-stop"></i>
				</article>
			</article>

		</section>

		</section>
	</main>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
		crossorigin="anonymous"></script>
	<script src="{{ url_for('static', filename='script/index.js') }}"></script>
</body>

</html>
