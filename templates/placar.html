<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{{ url_for('static', filename='estilo/placar2.css') }}">
	<title>Placar</title>
	<link rel="icon" href="/static/imagens/anuncios/logo_podium.png" type="image/x-icon">
</head>

<body>
	<main id="conteudo">
		<section class="top">
			<div id="placar" class="placar_{{dados.placar['status']}}">

				<p id="time1">{{dados.placar['time1']}}</p>
				<p id="time2">{{dados.placar['time2']}}</p>
				<p id="pontos1">{{dados.placar['pontos1']}}</p>
				<p id="pontos2">{{dados.placar['pontos2']}}</p>
				<p id="relogio">00:00</p>
				<!-- <p id="tempo">{{dados.cronometro['tempo']}}°</p> -->
				<img src="{{ url_for('static', filename='imagens/placar/placar_futebol1.png') }}">
			</div>
			<div id="propaganda">

			</div>
		</section>

	</main>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
	<script src="{{ url_for('static', filename='script/placar.js') }}"></script>

</html>
