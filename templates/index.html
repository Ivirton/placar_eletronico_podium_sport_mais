<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WebSocket Placar</title>
	<link rel="icon" href="/static/imagens/anuncios/logo_podium.png" type="image/x-icon">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="{{ url_for('static', filename='estilo/styles.css') }}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"
		integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="/">Controle</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/">Painel</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" target="_blank" href="/placar_futebol">Placar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/upload">Anúncios</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <section class="conteudo">
        <div id="accordion" class="dark-accordion">
          <!-- PLACAR -->
          <div class="card">
            <div class="card-header" id="headingOne">
              <h5 class="mb-0">
                <button class="btn btn-link" data-toggle="collapse" data-target="#collapseOne"
                  aria-expanded="true" aria-controls="collapseOne">
                  Placar
                </button>
              </h5>
            </div>

            <div id="collapseOne" class="collapse show" aria-labelledby="headingOne"
              data-parent="#accordion">
              <div class="card-body">
                <form action="" method="post">
                  <section class="secao">

                    <div class="form-group">
                      <span class="badge rounded-pill text-bg-secondary">PLACAR</span>
                    </div>
                    <div class="form-group">
                      <div></div>
                      <div></div>
                      <div class="visibilidade">
                        <!-- <i ativo="off" id="toggleIconPlacar" class="fa-solid fa-toggle-off fa-2xl active-icon"> -->
                          <i id="toggleIcon" ativo="{{dados.placar['status']}}"
                            class="fa-solid fa-toggle-{{dados.placar['status']}} fa-2xl active-icon"></i>
                        </i>
                      </div>
                    </div>
                    
                    <div class="form-group">
											<label for="">Informacão
												<input id="infor" placeholder="Informação" class="form-control"
													type="text" value="{{dados.placar['infor']}}">
											</label>
                      <label for="" style="width: 33%;">Tempo
                        <input type="number" min="1" placeholder="1º" class="form-control" id="partida" value="{{dados.placar['partida']}}">
                        
                      </label>
                    </div>
                    <div class="form-group">
                      <label for="">Time 1
                        <input type="text" placeholder="Time 1" class="form-control" id="time1" value="{{dados.placar['time1']}}" >
                      </label>
                      <label for="" style="width: 33%;">Pontos
                        <input type="number" min="0" placeholder="0pts" class="form-control"
                          id="pontos1"  value="{{dados.placar['pontos1']}}" >
                      </label>
                    </div>
                    <div class="form-group">
                      <label for="">Time 2
                        <input type="text" placeholder="Time 2" class="form-control" id="time2" value="{{dados.placar['time2']}}" >
                      </label>
                      <label for="" style="width: 33%;">Pontos
                        <input type="number" min="0" placeholder="0pts" class="form-control" id="pontos2" value="{{dados.placar['pontos2']}}">
                      </label>
                    </div>
                  
                    
                    <div class="form-group">
                      <input type="button" style="top: 8px; position: relative;" id="send" class="btn btn-primary"
                        value="Enviar">

                    </div>
                  </section>
                </form>
              </div>
            </div>
          </div>
          <!-- CRONOMETRO -->
          <div class="card">
            <div class="card-header" id="headingTwo">
              <h5 class="mb-0">
                <button class="btn btn-link collapsed" data-toggle="collapse" data-target="#collapseTwo"
                  aria-expanded="false" aria-controls="collapseTwo">
                  Cronometro
                </button>
              </h5>
            </div>
            <div id="collapseTwo" class="collapse" aria-labelledby="headingTwo" data-parent="#accordion">
              <div class="card-body">
                <form action="" method="post">
                  <div class="form-group">
                    <span class="badge rounded-pill text-bg-secondary">CRÔNOMETRO</span>
                  </div>
                  <div class="form-group">
                    <label for="">
                      <select name="tipo_cronometro" id="tipo_cronometro" class="form-control">
                        <option value="0">Progressivo</option>
                        <option value="1">Regressivo</option>
                      </select>
                    </label>
                    <label for="" style="width: 53%;">
                      
                      <input type="number" min="0" placeholder="0m" class="form-control"  value="{{dados.cronometro['duracao']}}"
                        id="duracao">
                    </label>
                    <div class="cronometro">
                      <i id="start" status="{{dados.cronometro['icone']}}"  class="fa-solid fa-{{dados.cronometro['icone']}}" ></i>
                      
                      <i id="stop" class="fas fa-stop"></i>
                      
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  


  <footer>
    <p>Todos os direitos reservados &copy; 2023 Criado por <a href="https://www.instagram.com/ivirton_nayron/"
        target="_blank"> Ivirton Nayron</a></p>
  </footer>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  
	<script src="{{ url_for('static', filename='script/index.js') }}"></script>
</body>

</html>
